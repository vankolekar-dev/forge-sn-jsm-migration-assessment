# ServiceNow → JSM workbench. Register with `forge register` (sets app.id), then `npm run deploy` and `forge install`.
modules:
  jira:globalPage:
    - key: snjsm-workbench
      title: ServiceNow → JSM workbench
      resource: ui
      resolver:
        function: resolver
  jira:adminPage:
    - key: snjsm-workbench-settings
      title: ServiceNow → JSM workbench
      resource: ui
      resolver:
        function: resolver
  consumer:
    - key: workbench-jobs-consumer
      queue: workbench-jobs
      function: job
  function:
    - key: resolver
      handler: index.handler
    - key: job
      handler: index.consumer
      timeoutSeconds: 900

resources:
  - key: ui
    path: static/ui/dist

permissions:
  scopes:
    - storage:app
    - read:jira-user
    - read:jira-work
    - write:jira-work
    - manage:jira-project
    - manage:jira-configuration
    - read:servicedesk-request
    - write:servicedesk-request
    - manage:servicedesk-customer
    - read:cmdb-schema:jira
    - write:cmdb-schema:jira
    - read:cmdb-type:jira
    - write:cmdb-type:jira
    - read:cmdb-attribute:jira
    - write:cmdb-attribute:jira
    - read:cmdb-object:jira
    - write:cmdb-object:jira

app:
  runtime:
    name: nodejs22.x
    memoryMB: 1024
    architecture: arm64
  id: ari:cloud:ecosystem::app/f7a9808e-cf87-42b4-a0e0-69057b4bfad4
